<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c85c88"><link rel="manifest" href="manifest.json"><title>Mi Salón</title><style>:root{--a:#c85c88;--bg:#fff7fb;--ink:#33252d;--mut:#806f78;--line:#eadde3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{text-align:center;padding:24px 15px 12px}h1{margin:0}p{color:var(--mut);margin:6px 0}.wrap{max-width:1000px;margin:auto;padding:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tab,.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;cursor:pointer;font-weight:700}.tab.on{background:#f5d8e4;border-color:#e7b8cc}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 25px #6b30420d}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.primary{background:var(--a);color:#fff;border:0}.list{display:grid;gap:8px;margin-top:12px}.item,.cartrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px;border:1px solid var(--line);border-radius:12px}.name{font-weight:700}.price{font-weight:800;color:var(--a)}.actions{display:flex;gap:5px;flex-wrap:wrap}.small{padding:7px 9px;font-size:13px}.danger{color:#b83b52}.total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:14px;padding-top:14px;font-size:24px;font-weight:900}.empty{text-align:center;color:var(--mut);padding:22px}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;padding:18px;border-radius:18px;width:min(430px,100%)}label{display:block;font-weight:700;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}}</style></head><body><header><h1>🌸 Mi Salón</h1><p>Catálogo y cuentas · sin IVA</p></header><main class="wrap"><div id="tabs" class="tabs"></div><div class="grid"><section class="card"><div class="head"><h2 id="title"></h2><button class="btn primary" onclick="add()">＋ Agregar</button></div><div id="services" class="list"></div></section><section class="card"><div class="head"><h2>🧾 Nueva cuenta</h2><button class="btn small" onclick="clearCart()">Vaciar</button></div><div id="cart" class="list"></div><div class="total"><span>TOTAL</span><span id="total">0,00 €</span></div></section></div></main><div id="modal" class="modal"><div class="box"><h2 id="mt">Agregar servicio</h2><label>Nombre</label><input id="mn" placeholder="Ej. Manicura semipermanente"><label>Precio (€)</label><input id="mp" type="number" min="0" step="0.01"><div class="modalfoot"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="save()">Guardar</button></div></div></div><script>const F=[['manicura','💅 Manicura'],['pedicura','🦶 Pedicura'],['cejas','✨ Cejas'],['pestanas','👁️ Pestañas']];const defaults={manicura:[['Manicura básica',15],['Manicura semipermanente',25]],pedicura:[['Pedicura básica',20],['Pedicura semipermanente',30]],cejas:[['Diseño de cejas',10],['Henna de cejas',18]],pestanas:[['Lifting de pestañas',35],['Extensiones de pestañas',55]]};let data;try{data=JSON.parse(localStorage.getItem('miSalonData'))}catch(e){}if(!data)data=Object.fromEntries(F.map(([id])=>[id,defaults[id].map(([name,price])=>({id:crypto.randomUUID(),name,price}))]));let fam='manicura',cart=[],editId=null;const money=n=>Number(n).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('miSalonData',JSON.stringify(data))}function render(){tabs.innerHTML=F.map(([id,n])=>`<button class="tab ${id===fam?'on':''}" onclick="fam='${id}';render()">${n}</button>`).join('');title.textContent=F.find(x=>x[0]===fam)[1];let a=data[fam];services.innerHTML=a.length?a.map(s=>`<div class="item"><div><div class="name">${esc(s.name)}</div><div class="price">${money(s.price)}</div></div><div class="actions"><button class="btn small" onclick="addCart('${s.id}')">Añadir</button><button class="btn small" onclick="edit('${s.id}')">Editar</button><button class="btn small danger" onclick="del('${s.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay servicios. Pulsa «Agregar».</div>';renderCart()}function addCart(id){let s=data[fam].find(x=>x.id===id);if(s){cart.push({...s});renderCart()}}function renderCart(){cartEl=cart;cart.innerHTML=cart.length?cart.map((s,i)=>`<div class="cartrow"><span>${esc(s.name)}</span><strong>${money(s.price)}</strong><button class="btn small danger" onclick="cart.splice(${i},1);renderCart()">×</button></div>`).join(''):'<div class="empty">Selecciona los servicios realizados.</div>';total.textContent=money(cart.reduce((a,s)=>a+Number(s.price),0))}function clearCart(){cart=[];renderCart()}function add(){editId=null;mt.textContent='Agregar servicio';mn.value='';mp.value='';modal.classList.add('show');mn.focus()}function edit(id){let s=data[fam].find(x=>x.id===id);editId=id;mt.textContent='Editar servicio';mn.value=s.name;mp.value=s.price;modal.classList.add('show');mn.focus()}function closeM(){modal.classList.remove('show')}function save(){let name=mn.value.trim(),price=Number(mp.value);if(!name||!Number.isFinite(price)||price<0){alert('Escribe un nombre y un precio válido.');return}if(editId){let s=data[fam].find(x=>x.id===editId);s.name=name;s.price=price;cart=cart.map(x=>x.id===editId?{...x,name,price}:x)}else data[fam].push({id:crypto.randomUUID(),name,price});persist();closeM();render()}function del(id){let s=data[fam].find(x=>x.id===id);if(confirm('¿Eliminar «'+s.name+'»?')){data[fam]=data[fam].filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);persist();render()}}render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></body></html>
