<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Salón</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fff7fb;color:#34262e}header{text-align:center;padding:24px}h1{margin:0}.wrap{max-width:1000px;margin:auto;padding:0 14px 35px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:white;border:1px solid #eadce3;border-radius:18px;padding:16px;box-shadow:0 8px 24px #0000000d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}.tab,.btn{border:1px solid #eadce3;background:white;border-radius:11px;padding:10px;cursor:pointer;font-weight:650}.tab.on{background:#f2d4e1}.primary{background:#c65b87;color:#fff;border:0}.title{display:flex;justify-content:space-between;gap:10px;align-items:center}.services{display:grid;gap:8px;margin-top:13px}.service,.line{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #eee1e7;border-radius:12px;padding:11px}.price{font-weight:800;color:#c04f7d}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.danger{color:#b63c51}.total{border-top:2px solid #34262e;margin-top:14px;padding-top:13px;display:flex;justify-content:space-between;font-size:23px;font-weight:900}.empty{text-align:center;color:#88747e;padding:25px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:20px;width:min(420px,100%)}label{display:block;margin:12px 0 5px;font-weight:650}input{width:100%;padding:11px;border:1px solid #eadce3;border-radius:10px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}@media(max-width:720px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>🌸 Mi Salón</h1><div>Servicios y cuentas · sin IVA</div></header><main class="wrap"><div class="grid"><section class="card"><div id="tabs" class="tabs"></div><div class="title"><h2 id="heading"></h2><button class="btn primary" onclick="add()">+ Servicio</button></div><div id="services" class="services"></div></section><section class="card"><h2>🧾 Cuenta</h2><div id="cart"></div><div class="total"><span>TOTAL</span><span id="total">0,00 €</span></div><button class="btn" onclick="clearCart()">Vaciar cuenta</button></section></div></main><div id="modal" class="modal"><div class="box"><h3 id="mt">Agregar servicio</h3><label>Nombre</label><input id="name" placeholder="Ej. Manicura semipermanente"><label>Precio (€)</label><input id="price" type="number" min="0" step="0.01" placeholder="25"><div class="modal-actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="save()">Guardar</button></div></div></div>
<script>
const families=[['manicura','💅 Manicura'],['pedicura','🦶 Pedicura'],['cejas','✨ Cejas'],['pestanas','👁️ Pestañas']];
const initial={manicura:[['Manicura básica',15],['Manicura semipermanente',25]],pedicura:[['Pedicura básica',20],['Pedicura semipermanente',30]],cejas:[['Diseño de cejas',10],['Henna de cejas',18]],pestanas:[['Lifting de pestañas',35],['Extensiones de pestañas',55]]};
let data=JSON.parse(localStorage.getItem('salon')||'null')||Object.fromEntries(families.map(([k])=>[k,initial[k].map(x=>({id:crypto.randomUUID(),name:x[0],price:x[1]}))]));let family='manicura',cart=[],editing=null;
const euro=n=>Number(n).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function persist(){localStorage.setItem('salon',JSON.stringify(data))}function render(){tabs.innerHTML=families.map(f=>`<button class="tab ${f[0]==family?'on':''}" onclick="family='${f[0]}';render()">${f[1]}</button>`).join('');heading.textContent=families.find(f=>f[0]==family)[1];services.innerHTML=data[family].length?data[family].map(s=>`<div class="service"><div><b>${esc(s.name)}</b><div class="price">${euro(s.price)}</div></div><div class="actions"><button class="btn" onclick="addCart('${s.id}')">Añadir</button><button class="btn" onclick="edit('${s.id}')">Editar</button><button class="btn danger" onclick="del('${s.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay servicios. Agrega el primero.</div>';renderCart()}
function addCart(id){let s=data[family].find(x=>x.id==id);if(s)cart.push({...s});renderCart()}function renderCart(){cartEl=cart;cartDiv=document.getElementById('cart');cartDiv.innerHTML=cart.length?cart.map((s,i)=>`<div class="line"><span>${esc(s.name)}</span><b>${euro(s.price)}</b><button class="btn danger" onclick="cart.splice(${i},1);renderCart()">×</button></div>`).join(''):'<div class="empty">Selecciona los servicios realizados.</div>';document.getElementById('total').textContent=euro(cart.reduce((a,s)=>a+Number(s.price),0))}function clearCart(){cart=[];renderCart()}
function add(){editing=null;mt.textContent='Agregar servicio';name.value='';price.value='';modal.classList.add('open');name.focus()}function edit(id){let s=data[family].find(x=>x.id==id);editing=id;mt.textContent='Editar servicio';name.value=s.name;price.value=s.price;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}
function save(){let n=name.value.trim(),p=Number(price.value);if(!n||!Number.isFinite(p)||p<0)return alert('Introduce nombre y precio válidos.');if(editing){let s=data[family].find(x=>x.id==editing);s.name=n;s.price=p;cart=cart.map(x=>x.id==editing?{...x,name:n,price:p}:x)}else data[family].push({id:crypto.randomUUID(),name:n,price:p});persist();closeM();render()}function del(id){let s=data[family].find(x=>x.id==id);if(confirm('¿Eliminar '+s.name+'?')){data[family]=data[family].filter(x=>x.id!=id);cart=cart.filter(x=>x.id!=id);persist();render()}}
modal.onclick=e=>{if(e.target===modal)closeM()};render();
</script></body></html>
